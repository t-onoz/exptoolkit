name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.9"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.9
        run: uv python install 3.9

      - name: Verify tag and project version
        shell: bash
        run: |
          version="$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run minimum-Python tox environment
        run: uv run --locked tox -e py39

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uv run --isolated --no-project --with twine twine check dist/*

      - name: Inspect distribution contents
        shell: python
        run: |
          import glob
          import os
          import re
          import tarfile
          import zipfile
          from email.parser import BytesParser

          version = os.environ["PACKAGE_VERSION"]
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          def verify(names, read_bytes, metadata_name):
              lowered = [name.lower() for name in names]
              assert any(name.endswith("exptoolkit/py.typed") for name in names)
              assert any("license" in name.rsplit("/", 1)[-1].lower() for name in names)
              forbidden = ("batanalysis", "__pycache__", ".pyc", "/.git/", ".pytest_cache", ".mypy_cache", ".ruff_cache")
              assert not any(any(item in name for item in forbidden) for name in lowered)
              metadata_bytes = read_bytes(metadata_name)
              metadata = BytesParser().parsebytes(metadata_bytes)
              assert metadata["Name"] == "exptoolkit"
              assert metadata["Version"] == version
              assert metadata["License-Expression"] == "MIT"
              text = metadata_bytes.decode("utf-8")
              assert "batanalysis" not in text.lower()
              assert not re.search(r"[A-Za-z]:\\", text)

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              verify(names, archive.read, metadata_name)

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              metadata_name = next(name for name in names if name.endswith("/PKG-INFO"))
              verify(names, lambda name: archive.extractfile(name).read(), metadata_name)

      - name: Smoke-test wheel and sdist
        shell: bash
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$distribution" -- \
              python -c 'from importlib.metadata import version; from exptoolkit.data import BaseData, Column, Role; assert version("exptoolkit") == "'"$PACKAGE_VERSION"'"'
          done

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/exptoolkit/

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Publish to PyPI with Trusted Publishing
        run: uv publish dist/*
