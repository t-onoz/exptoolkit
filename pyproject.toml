[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "exptoolkit"
version = "0.3.0"
description = "Toolkit for representing, processing, indexing, and plotting experimental data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "t-onoz" }
]
keywords = ["data", "processing", "visualization", "toolkit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries"
]

dependencies = [
  "numpy",
  "polars>=1.36",
  "pydantic>=2",
  "webcolors",
  "pint",
  "xlsxwriter",
  "typing_extensions ; python_version < \"3.11\"",
]


[project.optional-dependencies]
plotting = [
  "matplotlib",
  "openpyxl",
  "plotly",
]

qt = [
  "pyqtgraph",
  "PySide6",
]

pandas = [
  "pandas",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "mypy",
  "pre-commit",
  "ruff",
  "scipy",
  "tox",
  "coverage",
  "tox-uv",
  "pandas-stubs",
  "types-openpyxl",
  "pathlib-abc",
  "universal-pathlib>=0.2",
  "ipykernel>=6.31.0",
  "nbformat>=5.10.4",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["exptoolkit*"]


[tool.tox]
env_list = ["py39", "py310", "py311", "py312", "py313"]


[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
commands = [
  ["pytest"]
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["UP045"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true

# Relax type checks due to limitations in openpyxl type stubs.
[[tool.mypy.overrides]]
module = "exptoolkit.plotter.backends._openpyxl"
disable_error_code = ["union-attr"]
